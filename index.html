<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d14">
  <title>MediaHub Studio — historias para ver y descubrir</title>
  <meta name="description" content="Tu espacio creativo para descubrir videos, imágenes, descargas y cómics.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root{color-scheme:dark;--bg:#0b0d14;--panel:#121521;--line:#ffffff12;--muted:#9298aa;--purple:#9b7bff;--mint:#9ef0cf}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:#f6f5fa;font-family:"DM Sans",sans-serif;min-height:100vh}
    h1,h2,h3,.display{font-family:"Space Grotesk",sans-serif;letter-spacing:-.04em}
    button,input,select,textarea{font:inherit}button{cursor:pointer}
    .app-shell{width:100%;transition:max-width .3s ease}.app-shell.mode-vertical{max-width:560px;margin-inline:auto;min-height:100vh;border-inline:1px solid #ffffff10}.app-shell.mode-horizontal{max-width:1600px;margin-inline:auto}
    .glass{background:rgba(18,21,33,.82);backdrop-filter:blur(20px);border:1px solid var(--line)}
    .gradient-text{background:linear-gradient(100deg,#c4b1ff,#9ef0cf 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
    .hero-glow:before{content:"";position:absolute;width:520px;height:520px;right:-150px;top:-200px;background:#8262e633;filter:blur(100px);pointer-events:none}
    .poster-sheen{background:linear-gradient(180deg,transparent 35%,rgba(5,7,14,.9) 100%)}
    .soft-scroll::-webkit-scrollbar{width:7px;height:7px}.soft-scroll::-webkit-scrollbar-thumb{background:#34394a;border-radius:99px}
    .field{width:100%;background:#0c0f18;border:1px solid #ffffff19;border-radius:12px;padding:11px 13px;color:#f6f5fa;outline:none;transition:border .2s}
    .field:focus{border-color:#9b7bff}.field::placeholder{color:#747b8e}
    .field-label{display:block;font-size:.78rem;color:#bec2ce;margin-bottom:7px;font-weight:600}
    .btn-primary{background:linear-gradient(115deg,#9b7bff,#7761e8);color:white;border:0;border-radius:12px;padding:11px 16px;font-weight:700;box-shadow:0 8px 24px #7658e52d;transition:transform .2s,filter .2s}
    .btn-primary:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn-secondary{background:#ffffff0a;border:1px solid #ffffff18;border-radius:12px;padding:10px 14px;color:#e8e8f1;transition:background .2s}.btn-secondary:hover{background:#ffffff14}
    .nav-link{color:#a5a9b8;white-space:nowrap;transition:color .2s}.nav-link:hover,.nav-link.active{color:#fff}.nav-link.active:after{content:"";display:block;margin:5px auto -8px;width:16px;height:2px;border-radius:4px;background:#a78bfa}
    .card{background:linear-gradient(145deg,#151927,#10131d);border:1px solid #ffffff0e;transition:transform .25s,border-color .25s}.card:hover{transform:translateY(-3px);border-color:#a78bfa55}
    .pill{border:1px solid #ffffff18;background:#ffffff0a;border-radius:99px;padding:5px 10px;font-size:.7rem;color:#c8c7d5}
    .accordion-content{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}.accordion-content.open{grid-template-rows:1fr}.accordion-content>div{overflow:hidden}
    .tab-btn{padding:10px 13px;border-radius:10px;color:#9ca2b3;white-space:nowrap}.tab-btn.active{background:#9b7bff20;color:#d6caff;border:1px solid #9b7bff48}
    .toast{animation:toast-in .28s ease both}@keyframes toast-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .modal-backdrop{background:#05060bd9;backdrop-filter:blur(13px)}
    .media-frame{position:relative;overflow:hidden;background:#090b11}
    .media-frame iframe,.media-frame video{position:absolute;inset:0;width:100%;height:100%;border:0}
    .aspect-poster{aspect-ratio:9/16}.aspect-landscape{aspect-ratio:16/9}
    .horizontal-span{grid-column:span 2}
    .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
    .grid-adaptive{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
    @media(max-width:640px){.horizontal-span{grid-column:span 1}.mobile-pad{padding-inline:18px}.mobile-hide{display:none!important}}
    @media(min-width:900px){.mode-horizontal .grid-adaptive{grid-template-columns:repeat(4,minmax(0,1fr))}}
  </style>
</head>
<body>
  <div id="app" class="app-shell mode-horizontal">
    <header class="sticky top-0 z-40 border-b border-white/10 bg-[#0b0d14]/85 backdrop-blur-xl">
      <div class="mx-auto flex max-w-[1440px] items-center justify-between gap-4 px-4 py-3 md:px-8">
        <button class="flex shrink-0 items-center gap-2.5 text-left" data-page="inicio" aria-label="Ir al inicio">
          <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-violet-400 to-indigo-600 text-white shadow-lg shadow-violet-500/20"><i class="fa-solid fa-play text-xs"></i></span>
          <span class="display text-[17px] font-bold tracking-tight">mediahub<span class="text-violet-300">.</span></span>
        </button>
        <nav class="no-scrollbar flex items-center gap-4 overflow-x-auto text-[13px] md:gap-6" aria-label="Navegación principal">
          <button class="nav-link active" data-page="inicio">Inicio</button><button class="nav-link" data-page="videos">Vídeos</button><button class="nav-link" data-page="imagenes">Imágenes</button><button class="nav-link" data-page="descargas">Descargas</button><button class="nav-link" data-page="comics">Cómics</button><button class="nav-link hidden" id="admin-nav" data-page="admin">Estudio</button>
        </nav>
        <div class="flex shrink-0 items-center gap-2">
          <button id="orientation-toggle" class="btn-secondary h-9 w-9 p-0 text-xs sm:h-auto sm:w-auto sm:px-3 sm:py-2 sm:inline-flex sm:items-center sm:gap-2" title="Cambiar formato de vista"><i class="fa-solid fa-mobile-screen-button"></i><span id="orientation-label" class="hidden lg:inline">Horizontal</span></button>
          <button id="sound-toggle" class="btn-secondary h-9 w-9 p-0" title="Silenciar"><i class="fa-solid fa-volume-high"></i></button>
          <span id="session-badge" class="inline-flex max-w-[92px] items-center truncate rounded-full border border-white/10 bg-white/5 px-2 py-1.5 text-[10px] text-slate-300 sm:max-w-none sm:px-2.5 sm:text-[11px]"><i class="fa-solid fa-globe mr-1.5 shrink-0 text-emerald-300"></i>Público</span>
          <button id="logout-button" class="btn-secondary h-9 w-9 p-0 text-sm" title="Salir"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
        </div>
      </div>
    </header>
    <main id="page-content" class="min-h-[75vh]"></main>
    <footer class="border-t border-white/10 px-5 py-8 text-center text-xs text-slate-500">
      <p><span class="text-slate-300">mediahub.</span> Un espacio para descubrir historias. <span class="mx-2">·</span> Hecho para compartir.</p>
    </footer>
  </div>
  <div id="modal-root"></div><div id="toast-root" class="fixed bottom-5 right-5 z-[100] flex max-w-[calc(100vw-2.5rem)] flex-col gap-2"></div>
  <script>
    (() => {
      "use strict";
      const STORAGE_KEY = "mediahub-studio-v1";
      const img = (id, w=900) => `https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=85`;
      const seed = {
        users:[{id:"admin-default",username:"admin",pin:"123456",role:"Administrador"}],
        items:[
          {id:"v1",type:"video",title:"Luz de invierno",category:"Cortometraje",source:"https://www.w3schools.com/html/mov_bbb.mp4",poster:img("photo-1470252649378-9c29740c9fa8"),duration:"02:14",orientation:"horizontal",visibility:"public",featured:true,description:"Un viaje visual entre la calma y la luz."},
          {id:"v2",type:"video",title:"Entre montañas",category:"Naturaleza",source:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",poster:img("photo-1464822759023-fed622ff2c3b"),duration:"00:42",orientation:"vertical",visibility:"public",featured:true,description:"Un instante de quietud en las alturas."},
          {id:"v3",type:"video",title:"Ciudad en movimiento",category:"Documental",source:"https://www.w3schools.com/html/movie.mp4",poster:img("photo-1519608487953-e999c86e7455"),duration:"01:36",orientation:"horizontal",visibility:"public",featured:true,description:"La ciudad despierta, plano a plano."},
          {id:"v4",type:"video",title:"Pequeños universos",category:"Animación",source:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",poster:img("photo-1441974231531-c6227db76b6e"),duration:"00:58",orientation:"vertical",visibility:"public",featured:true,description:"Naturaleza en primer plano."},
          {id:"v5",type:"video",title:"Rutas del mar",category:"Viajes",source:"https://www.w3schools.com/html/mov_bbb.mp4",poster:img("photo-1518837695005-2083093ee35b"),duration:"03:08",orientation:"horizontal",visibility:"public",featured:true,description:"Una travesía por aguas abiertas."},
          ...[
            ["i1","Luz entre hojas","photo-1441974231531-c6227db76b6e","Naturaleza","horizontal"],
            ["i2","Azul profundo","photo-1518837695005-2083093ee35b","Paisaje","vertical"],
            ["i3","Hora dorada","photo-1470252649378-9c29740c9fa8","Fotografía","horizontal"],
            ["i4","Horizonte abierto","photo-1464822759023-fed622ff2c3b","Aventura","vertical"],
            ["i5","Ciudad nocturna","photo-1519608487953-e999c86e7455","Urbano","horizontal"]
          ].map(([id,title,picture,category,orientation])=>({id,type:"image",title,category,source:img(picture,1200),orientation,visibility:"public",description:"Una imagen seleccionada para la colección destacada."})),
          {id:"d1",type:"download",title:"Paquete de fondos — Naturaleza",category:"Recursos",fileType:"ZIP",size:"24.8 MB",version:"1.2.0",url:"https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf",orientation:"horizontal",visibility:"public",downloads:128,description:"Una colección de fondos para tus proyectos creativos."},
          {id:"d2",type:"download",title:"Guía de composición visual",category:"Guías",fileType:"PDF",size:"3.2 MB",version:"2.0.1",url:"https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf",orientation:"vertical",visibility:"public",downloads:84,description:"Principios prácticos para contar mejores historias."},
          {id:"d3",type:"download",title:"Cortometraje: Luz de invierno",category:"Vídeo",fileType:"MP4",size:"86 MB",version:"1.0.0",url:"https://www.w3schools.com/html/mov_bbb.mp4",orientation:"horizontal",visibility:"public",downloads:52,description:"Descarga el cortometraje en alta calidad."},
          {id:"c1",type:"comic",title:"La última estrella",category:"Fantasía",chapter:"Capítulo 01",cover:img("photo-1534447677768-be436bb09401"),pages:[img("photo-1534796636912-3b95b3ab5986"),img("photo-1462331940025-496dfbfc7564"),img("photo-1500530855697-b586d89ba3ee")],orientation:"vertical",visibility:"public",description:"Cuando el cielo se queda sin estrellas, Mara encuentra una luz que nadie más puede ver."},
          {id:"c2",type:"comic",title:"Cartas desde el mar",category:"Aventura",chapter:"Capítulo 02",cover:img("photo-1518837695005-2083093ee35b"),pages:[img("photo-1500375592092-40eb2168fd21"),img("photo-1497436072909-60f36e1d4b1b"),img("photo-1473116763249-2faaef81ccda")],orientation:"horizontal",visibility:"public",description:"Una carta en una botella cambia el rumbo de una travesía."}
        ]
      };
      function loadState(){
        try {
          const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
          if(saved&&Array.isArray(saved.items)&&Array.isArray(saved.users)) return {...seed,...saved,items:saved.items,users:saved.users};
        } catch(error){ console.error("No se pudo leer el contenido guardado.",error); }
        return {...seed,session:null,muted:false,orientationMode:"horizontal",downloads:{}};
      }
      let state=loadState(), page=location.hash.slice(1)||"inicio", adminTab="publicacion", activeComic=null, openAccordion=null, selectedType="video";
      const $=(selector,root=document)=>root.querySelector(selector), $$=(selector,root=document)=>Array.from(root.querySelectorAll(selector));
      const esc=(value="")=>String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
      const persist=()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(error){console.error("No se pudieron guardar los cambios.",error);toast("No se pudo guardar en este dispositivo.","error")}};
      const id=()=>`${Date.now().toString(36)}${Math.random().toString(36).slice(2,8)}`;
      const user=()=>state.users.find(u=>u.id===state.session?.userId)||null;
      const isPrivate=()=>Boolean(user());
      const isAdmin=()=>user()?.role==="Administrador";
      const canSee=item=>item.visibility==="public"|| (isPrivate()&&item.visibility==="registered") || (isAdmin()&&item.visibility==="admin");
      const visibleItems=type=>state.items.filter(item=>item.type===type&&canSee(item));
      const format=item=>item.orientation==="vertical"?"vertical":"horizontal";
      const visibilityLabel=value=>({public:"Público",registered:"Usuarios registrados",admin:"Administradores"}[value]||"Público");
      const setHash=next=>{page=next;location.hash=next;render()};
      function toast(message,type="success"){
        const node=document.createElement("div");node.className="toast glass rounded-xl px-4 py-3 text-sm shadow-2xl "+(type==="error"?"text-rose-200":"text-slate-100");
        node.innerHTML=`<i class="fa-solid ${type==="error"?"fa-circle-exclamation text-rose-300":"fa-circle-check text-emerald-300"} mr-2"></i>${esc(message)}`;
        $("#toast-root").append(node);setTimeout(()=>node.remove(),3400)
      }
      function filtered(){
        if(!isPrivate())return state.items.filter(x=>x.visibility==="public");
        return state.items.filter(x=>x.visibility!=="admin"||isAdmin());
      }
      function routeAllowed(next){
        if(next==="admin"&&!isPrivate()){toast("Inicia sesión en modo privado para acceder al estudio.","error");return "inicio"}
        if(next==="admin"&&user()?.role==="Lector VIP"){toast("Tu cuenta no tiene permisos para el estudio.","error");return "inicio"}
        return next;
      }
      function cardClass(item){return format(item)==="vertical"?"aspect-poster":"aspect-landscape"}
      function orientCard(item){return format(item)==="horizontal"?"horizontal-span":""}
      function imageCard(item,featured=false){
        return `<button class="card group relative overflow-hidden rounded-2xl text-left ${orientCard(item)}" data-image="${esc(item.id)}" aria-label="Ver imagen ${esc(item.title)}">
          <div class="relative ${cardClass(item)}"><img src="${esc(item.source)}" alt="${esc(item.title)}" class="h-full w-full object-cover transition duration-500 group-hover:scale-105" onerror="this.src='https://placehold.co/900x600/171827/aaa?text=Imagen+no+disponible'"><div class="poster-sheen absolute inset-0"></div>
          <div class="absolute inset-x-0 bottom-0 p-4"><span class="pill">${esc(item.category||"Galería")}</span><h3 class="mt-2 text-base font-semibold">${esc(item.title)}</h3></div><span class="absolute right-3 top-3 flex h-9 w-9 items-center justify-center rounded-full bg-black/35 text-white backdrop-blur"><i class="fa-solid fa-up-right-and-down-left-from-center text-xs"></i></span></div>
        </button>`
      }
      function videoCard(item){
        return `<article class="card overflow-hidden rounded-2xl ${orientCard(item)}"><button data-play="${esc(item.id)}" class="group relative block w-full text-left"><div class="media-frame ${cardClass(item)}"><img class="h-full w-full object-cover transition duration-500 group-hover:scale-105" src="${esc(item.poster||"")}" alt="${esc(item.title)}" onerror="this.src='https://placehold.co/600x900/171827/aaa?text=Vista+previa'"><div class="poster-sheen absolute inset-0"></div><span class="absolute inset-0 m-auto flex h-12 w-12 items-center justify-center rounded-full border border-white/40 bg-white/20 text-white backdrop-blur"><i class="fa-solid fa-play ml-0.5"></i></span><span class="pill absolute bottom-3 right-3">${esc(item.duration||"Vídeo")}</span></div></button><div class="p-4"><div class="mb-2 flex flex-wrap gap-2"><span class="pill">${esc(item.category||"Vídeo")}</span><span class="pill">${format(item)==="vertical"?"9:16 vertical":"16:9 horizontal"}</span></div><h3 class="font-semibold">${esc(item.title)}</h3><p class="mt-1 line-clamp-2 text-xs leading-5 text-slate-400">${esc(item.description||"")}</p></div></article>`
      }
      function downloadCard(item){
        const count=Number(state.downloads?.[item.id]??item.downloads??0);
        return `<article class="card flex flex-col overflow-hidden rounded-2xl ${orientCard(item)}"><div class="relative ${cardClass(item)} overflow-hidden bg-gradient-to-br from-violet-500/20 via-[#19172a] to-emerald-300/10"><div class="absolute inset-0 opacity-25" style="background-image:radial-gradient(circle at 75% 20%,#b8a6ff 0,transparent 35%),radial-gradient(circle at 15% 80%,#7eddb7 0,transparent 35%)"></div><span class="absolute left-4 top-4 pill">${esc(item.fileType||"ARCHIVO")}</span><span class="absolute right-4 top-4 pill">${format(item)==="vertical"?"9:16":"16:9"}</span><span class="absolute inset-0 flex items-center justify-center"><i class="fa-solid ${item.fileType==="PDF"?"fa-file-pdf":item.fileType==="ZIP"?"fa-file-zipper":"fa-film"} text-5xl text-white/80 drop-shadow-lg"></i></span><span class="absolute bottom-4 left-4 text-xs text-white/70">${esc(item.category||"Recursos")}</span></div><div class="flex flex-1 flex-col p-5"><div class="flex-1"><h3 class="font-semibold">${esc(item.title)}</h3><p class="mt-2 text-sm leading-6 text-slate-400">${esc(item.description||"")}</p><div class="mt-4 flex flex-wrap gap-2"><span class="pill">${esc(item.size||"Tamaño variable")}</span><span class="pill">v${esc(item.version||"1.0")}</span></div></div><div class="mt-5 flex items-center justify-between gap-3 border-t border-white/10 pt-4"><span class="text-xs text-slate-500"><i class="fa-solid fa-download mr-1"></i>${count} descargas</span><a class="btn-primary inline-flex items-center gap-2 text-xs" href="${esc(safeUrl(item.url)||"#")}" download target="_blank" rel="noopener" data-download="${esc(item.id)}">Descargar <i class="fa-solid fa-arrow-down"></i></a></div></div></article>`
      }
      function comicCard(item){
        return `<button class="card group overflow-hidden rounded-2xl text-left ${orientCard(item)}" data-comic="${esc(item.id)}"><div class="relative ${cardClass(item)}"><img src="${esc(item.cover||"")}" alt="Portada de ${esc(item.title)}" class="h-full w-full object-cover transition duration-500 group-hover:scale-105" onerror="this.src='https://placehold.co/600x900/171827/aaa?text=Portada'"><div class="poster-sheen absolute inset-0"></div><div class="absolute inset-x-0 bottom-0 p-4"><span class="pill">${esc(item.chapter||"Cómic")}</span><h3 class="mt-2 text-lg font-semibold">${esc(item.title)}</h3><p class="mt-1 line-clamp-2 text-xs text-slate-300">${esc(item.description||"")}</p></div><span class="absolute right-3 top-3 rounded-full bg-violet-500/90 px-3 py-1.5 text-xs font-bold"><i class="fa-solid fa-book-open mr-1"></i>Leer</span></div></button>`
      }
      function safeUrl(value){
        try{const parsed=new URL(String(value||""),location.href);return ["https:","http:"].includes(parsed.protocol)?parsed.href:null}catch{return null}
      }
      function mediaUrl(source){
        const raw=String(source||"").trim();let src=raw;
        const iframeSrc=raw.match(/<iframe\b[^>]*\bsrc=["']([^"']+)["']/i);if(iframeSrc)src=iframeSrc[1];
        const safe=safeUrl(src);if(!safe)return null;
        try{
          const parsed=new URL(safe);
          if(parsed.hostname==="youtu.be"){parsed.pathname="/embed/"+parsed.pathname.slice(1);parsed.searchParams.set("enablejsapi","1");parsed.searchParams.set("origin",location.origin);if(state.muted)parsed.searchParams.set("mute","1");return parsed.href}
          if(parsed.hostname.includes("youtube.com")){
            if(!parsed.pathname.includes("/embed/")){const videoId=parsed.searchParams.get("v");if(videoId)parsed.pathname="/embed/"+videoId}
            parsed.searchParams.set("enablejsapi","1");parsed.searchParams.set("origin",location.origin);if(state.muted)parsed.searchParams.set("mute","1");return parsed.href
          }
          if(parsed.hostname.includes("vimeo.com")&&!parsed.hostname.includes("player.vimeo.com"))parsed.pathname="/video"+parsed.pathname;
          if(parsed.hostname.includes("vimeo.com"))parsed.searchParams.set("muted",state.muted?"1":"0");
          return parsed.href
        }catch{return null}
      }
      function player(item,autoplay=false){
        const source=safeUrl(item.source),embed=mediaUrl(item.source);
        if(!source)return `<div class="flex h-full flex-col items-center justify-center gap-3 bg-slate-900 p-8 text-center text-slate-300"><i class="fa-solid fa-triangle-exclamation text-2xl text-amber-300"></i><span>El recurso no está disponible o su dirección no es válida.</span></div>`;
        if(/\.(mp4|webm|ogg)(?:[?#]|$)/i.test(new URL(source).pathname+new URL(source).search)){
          return `<video controls playsinline preload="metadata" ${state.muted?"muted":""} ${autoplay?"autoplay":""} poster="${esc(item.poster||"")}" class="h-full w-full object-contain" onerror="this.outerHTML='<div class=&quot;flex h-full items-center justify-center p-8 text-center text-slate-300&quot;>No se pudo cargar este vídeo. Comprueba el enlace e inténtalo de nuevo.</div>'"><source src="${esc(source)}" type="${/\.webm/i.test(source)?"video/webm":/\.ogg/i.test(source)?"video/ogg":"video/mp4"}">Tu navegador no puede reproducir este vídeo.</video>`
        }
        if(embed)return `<iframe src="${esc(embed)}${autoplay?(embed.includes("?")?"&":"?")+"autoplay=1":""}" title="${esc(item.title)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
        return `<div class="flex h-full items-center justify-center p-8 text-center text-slate-300">No se pudo cargar este recurso.</div>`
      }
      const sectionHead=(eyebrow,title,description="")=>`<div class="mb-7 flex flex-col justify-between gap-3 sm:flex-row sm:items-end"><div><p class="mb-2 text-[11px] font-bold uppercase tracking-[.22em] text-violet-300">${eyebrow}</p><h2 class="display text-3xl font-semibold sm:text-4xl">${title}</h2>${description?`<p class="mt-2 max-w-xl text-sm leading-6 text-slate-400">${description}</p>`:""}</div></div>`;
      function render(){
        page=routeAllowed(page);

        $("#sound-toggle").innerHTML=`<i class="fa-solid ${state.muted?"fa-volume-xmark":"fa-volume-high"}"></i>`;$("#sound-toggle").title=state.muted?"Activar sonido":"Silenciar";

          </div><div class="glass absolute -bottom-5 left-1/2 flex -translate-x-1/2 items-center gap-3 rounded-xl px-4 py-3 shadow-2xl"><span class="flex h-9 w-9 items-center justify-center rounded-full bg-emerald-300/10 text-emerald-200"><i class="fa-solid fa-sparkles"></i></span><span class="whitespace-nowrap text-xs"><b class="block text-slate-100">Inspiración sin límites</b><span class="text-slate-400">Una colección en constante crecimiento</span></span></div></div></div></section>
          <section class="mx-auto max-w-[1440px] px-5 py-12 md:px-10">${sectionHead("Selección del estudio","Reproduce a tu ritmo","Abre cada historia para disfrutar el reproductor adaptado a su formato.")}<div class="space-y-3">${featured.map((v,i)=>`<article class="overflow-hidden rounded-2xl border border-white/10 bg-white/[.025]"><button data-accordion="${esc(v.id)}" class="flex w-full items-center gap-4 p-4 text-left sm:p-5"><span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-violet-400/10 text-sm text-violet-200">${String(i+1).padStart(2,"0")}</span><span class="min-w-0 flex-1"><b class="block truncate text-sm sm:text-base">${esc(v.title)}</b><span class="mt-1 block text-xs text-slate-500">${esc(v.category)} <span class="mx-1">·</span> ${format(v)==="vertical"?"Vertical 9:16":"Horizontal 16:9"}</span></span><span class="pill hidden sm:block">${esc(v.duration||"Vídeo")}</span><i class="fa-solid fa-chevron-down text-xs text-slate-500 transition ${openAccordion===v.id?"rotate-180":""}"></i></button><div class="accordion-content ${openAccordion===v.id?"open":""}"><div><div class="border-t border-white/10 bg-black/20 p-3 sm:p-5"><div class="media-frame mx-auto max-h-[680px] w-full max-w-4xl ${format(v)==="vertical"?"aspect-[9/16] max-w-sm":"aspect-video"}">${openAccordion===v.id?player(v):""}</div><p class="mt-3 text-sm text-slate-400">${esc(v.description||"")}</p></div></div></div></article>`).join("")||emptyState("Aún no hay vídeos destacados.")}</div></section>

      function emptyState(text){return `<div class="col-span-full rounded-2xl border border-dashed border-white/15 px-6 py-12 text-center text-sm text-slate-500"><i class="fa-regular fa-folder-open mb-3 block text-2xl"></i>${esc(text)}</div>`}

      function comicsPage(){const items=visibleItems("comic");if(activeComic){const comic=items.find(i=>i.id===activeComic);if(comic)return pageWrap(`<button id="back-comics" class="btn-secondary mb-7 text-sm"><i class="fa-solid fa-arrow-left mr-2"></i>Volver a la biblioteca</button><div class="mx-auto max-w-3xl"><div class="mb-7 text-center"><p class="text-xs uppercase tracking-[.2em] text-violet-300">${esc(comic.chapter||"Cómic")}</p><h1 class="display mt-2 text-3xl font-semibold sm:text-5xl">${esc(comic.title)}</h1><p class="mx-auto mt-3 max-w-xl text-sm leading-6 text-slate-400">${esc(comic.description||"")}</p><p class="mt-3 text-xs text-slate-500">Desplázate para leer la historia</p></div><div class="overflow-hidden rounded-2xl border border-white/10 bg-black">${(comic.pages||[]).map((src,i)=>`<img class="block h-auto w-full" src="${esc(src)}" alt="${esc(comic.title)} — página ${i+1}" loading="lazy" onerror="this.src='https://placehold.co/900x1200/171827/aaa?text=Pagina+no+disponible'">`).join("")||`<div class="p-10 text-center text-slate-400">Este cómic aún no tiene páginas.</div>`}</div><p class="py-8 text-center text-xs text-slate-500">Fin del capítulo <span class="text-violet-200">${esc(comic.chapter||"")}</span></p></div>`)}

      const typeNames={video:"Vídeos",image:"Imágenes",download:"Descargas",comic:"Cómics"};
      function adminPage(){

      }
      function bindPageActions(){
        $$("[data-page]",$("#page-content")).forEach(b=>b.addEventListener("click",()=>setHash(b.dataset.page)));
        $$("[data-accordion]").forEach(b=>b.addEventListener("click",()=>{openAccordion=openAccordion===b.dataset.accordion?null:b.dataset.accordion;render()}));
        $$("[data-play]").forEach(b=>b.addEventListener("click",()=>openVideo(b.dataset.play)));
        $$("[data-image]").forEach(b=>b.addEventListener("click",()=>openImage(b.dataset.image)));
        $$("[data-comic]").forEach(b=>b.addEventListener("click",()=>{activeComic=b.dataset.comic;render();window.scrollTo({top:0,behavior:"smooth"})}));
        $("#back-comics")?.addEventListener("click",()=>{activeComic=null;render()});
        $$("[data-download]").forEach(link=>link.addEventListener("click",()=>{const key=link.dataset.download;state.downloads=state.downloads||{};state.downloads[key]=Number(state.downloads[key]??state.items.find(x=>x.id===key)?.downloads??0)+1;persist();setTimeout(render,250)}));
        $$("[data-admin-tab]").forEach(b=>b.addEventListener("click",()=>{adminTab=b.dataset.adminTab;render()}));
        $$("[data-content-type]").forEach(b=>b.addEventListener("click",()=>{selectedType=b.dataset.contentType;render()}));
        $$("[data-delete-item]").forEach(b=>b.addEventListener("click",()=>deleteItem(b.dataset.deleteItem)));
        $$("[data-delete-user]").forEach(b=>b.addEventListener("click",()=>deleteUser(b.dataset.deleteUser)));
        $("#publish-form")?.addEventListener("submit",publishItem);
        $("#profile-form")?.addEventListener("submit",updateProfile);
        $("#user-form")?.addEventListener("submit",createUser);
        $("#reset-credentials")?.addEventListener("click",resetCredentials)
      }
      function openVideo(itemId){
        const item=state.items.find(x=>x.id===itemId&&canSee(x));if(!item)return;
        $("#modal-root").innerHTML=`<div class="modal-backdrop fixed inset-0 z-[80] flex items-center justify-center p-3 sm:p-8" data-close-modal><section class="relative flex max-h-[95vh] w-full max-w-5xl flex-col overflow-hidden rounded-2xl border border-white/15 bg-[#10131d] shadow-2xl" role="dialog" aria-modal="true" aria-label="${esc(item.title)}"><div class="flex items-center justify-between gap-3 border-b border-white/10 px-4 py-3"><div><h2 class="font-semibold">${esc(item.title)}</h2><p class="text-xs text-slate-500">${esc(item.category||"Vídeo")} · ${format(item)==="vertical"?"Vertical 9:16":"Horizontal 16:9"}</p></div><button class="close-modal btn-secondary h-9 w-9 p-0" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button></div><div class="media-frame mx-auto max-h-[calc(95vh-70px)] ${format(item)==="vertical"?"aspect-[9/16] h-[calc(95vh-70px)] max-w-[min(95vw,420px)]":"aspect-video w-full"}">${player(item,true)}</div></section></div>`;
        bindModal()
      }
      function openImage(itemId){
        const item=state.items.find(x=>x.id===itemId&&canSee(x));if(!item)return;
        const images=visibleItems("image"),index=images.findIndex(i=>i.id===itemId);
        $("#modal-root").innerHTML=`<div class="modal-backdrop fixed inset-0 z-[80] flex items-center justify-center p-3 sm:p-8" data-close-modal><section class="relative flex h-full max-h-[92vh] w-full max-w-6xl flex-col items-center justify-center" role="dialog" aria-modal="true" aria-label="Visor de imágenes"><div class="absolute right-0 top-0 z-10 flex items-center gap-2"><span class="pill">${index+1} / ${images.length}</span><button class="close-modal btn-secondary h-10 w-10 p-0"><i class="fa-solid fa-xmark"></i></button></div><img src="${esc(item.source)}" alt="${esc(item.title)}" class="max-h-[78vh] max-w-full rounded-xl object-contain shadow-2xl"><div class="mt-4 text-center"><h2 class="font-semibold">${esc(item.title)}</h2><p class="mt-1 text-sm text-slate-400">${esc(item.category||"")}</p></div>${images.length>1?`<div class="mt-4 flex gap-2"><button class="btn-secondary" data-image-nav="${(index-1+images.length)%images.length}"><i class="fa-solid fa-arrow-left mr-2"></i>Anterior</button><button class="btn-secondary" data-image-nav="${(index+1)%images.length}">Siguiente<i class="fa-solid fa-arrow-right ml-2"></i></button></div>`:""}</section></div>`;
        bindModal();$$("[data-image-nav]").forEach(b=>b.addEventListener("click",()=>{const next=images[Number(b.dataset.imageNav)];openImage(next.id)}))
      }
      function bindModal(){
        $$(".close-modal").forEach(b=>b.addEventListener("click",()=>$("#modal-root").innerHTML=""));
        $("#modal-root").addEventListener("click",e=>{if(e.target.hasAttribute("data-close-modal"))$("#modal-root").innerHTML=""},{once:true});
        document.addEventListener("keydown",function escape(e){if(e.key==="Escape"&&$("#modal-root").innerHTML){$("#modal-root").innerHTML="";document.removeEventListener("keydown",escape)}})
      }
      function publishItem(event){
        event.preventDefault();const data=Object.fromEntries(new FormData(event.currentTarget));const record={id:id(),type:selectedType,title:String(data.title||"").trim(),category:String(data.category||"General").trim(),orientation:data.orientation,visibility:data.visibility||"public",description:String(data.description||"").trim()};
        if(!record.title){toast("Escribe un título para publicar.","error");return}
        if(selectedType==="video"){
          if(!mediaUrl(data.source)){toast("Introduce una URL http(s) válida o un código iframe con origen seguro.","error");return}
          record.source=String(data.source).trim();record.poster=safeUrl(data.poster)||"";record.duration=String(data.duration||"").trim();record.featured=data.featured==="on";
        } else if(selectedType==="image"){
          record.source=safeUrl(data.source);if(!record.source){toast("Introduce una dirección válida para la imagen.","error");return}
        } else if(selectedType==="download"){
          record.url=safeUrl(data.url);if(!record.url){toast("Introduce una dirección de descarga válida.","error");return}
          record.fileType=data.fileType;record.size=String(data.size||"").trim();record.version=String(data.version||"1.0").trim();record.downloads=0
        } else {
          record.chapter=String(data.chapter||"").trim();record.cover=safeUrl(data.cover);record.pages=String(data.pages||"").split(",").map(x=>safeUrl(x.trim())).filter(Boolean);
          if(!record.cover||!record.pages.length){toast("Añade una portada y al menos una página con URL válida.","error");return}
        }
        state.items.push(record);persist();toast(`${typeNames[selectedType].slice(0,-1)} publicado correctamente.`);render()
      }
      function deleteItem(itemId){
        const item=state.items.find(x=>x.id===itemId);if(!item)return;
        if(!confirm(`¿Eliminar «${item.title}»? Esta acción no se puede deshacer.`))return;
        state.items=state.items.filter(x=>x.id!==itemId);if(state.downloads)delete state.downloads[itemId];persist();toast("Contenido eliminado.");render()
      }
      function updateProfile(event){
        event.preventDefault();const data=Object.fromEntries(new FormData(event.currentTarget)),account=user();
        if(data.currentPin!==account.pin){toast("El PIN actual no es correcto.","error");return}
        const username=String(data.username||"").trim();if(!username){toast("El nombre de usuario no puede quedar vacío.","error");return}
        if(state.users.some(u=>u.id!==account.id&&u.username.toLowerCase()===username.toLowerCase())){toast("Ese nombre de usuario ya está en uso.","error");return}
        if(data.pin&&!/^\d{6}$/.test(data.pin)){toast("El nuevo PIN debe tener exactamente 6 dígitos.","error");return}
        account.username=username;if(data.pin)account.pin=data.pin;persist();toast("Perfil actualizado.");render()
      }
      function createUser(event){
        event.preventDefault();const data=Object.fromEntries(new FormData(event.currentTarget)),username=String(data.username||"").trim();
        if(!username||!/^\d{6}$/.test(String(data.pin||""))){toast("El nombre es obligatorio y el PIN debe tener 6 dígitos.","error");return}
        if(state.users.some(u=>u.username.toLowerCase()===username.toLowerCase())){toast("Ese nombre de usuario ya existe.","error");return}
        state.users.push({id:id(),username,pin:data.pin,role:data.role});persist();toast("Usuario registrado.");render()
      }
      function deleteUser(userId){
        const target=state.users.find(u=>u.id===userId);if(!target)return;
        if(target.id===user()?.id){toast("No puedes eliminar la cuenta activa.","error");return}
        if(target.role==="Administrador"&&state.users.filter(u=>u.role==="Administrador").length<=1){toast("Debe permanecer al menos un administrador.","error");return}
        if(!confirm(`¿Eliminar la cuenta de ${target.username}?`))return;
        state.users=state.users.filter(u=>u.id!==userId);persist();toast("Cuenta eliminada.");render()
      }
      function resetCredentials(){
        const account=user();if(!account)return;
        const conflict=state.users.some(candidate=>candidate.id!==account.id&&candidate.username.toLowerCase()==="admin");
        if(conflict){toast("Otra cuenta ya usa el nombre admin. Elimínala antes de restablecer tu perfil.","error");return}
        if(!confirm("Se restablecerá tu cuenta a admin / 123456 y se conservarán las demás cuentas. ¿Continuar?"))return;
        account.username="admin";account.pin="123456";persist();toast("Tu acceso se restableció a admin / 123456.");render()
      }
      function accessModal(){
        $("#modal-root").innerHTML=`<div class="modal-backdrop fixed inset-0 z-[90] flex items-center justify-center overflow-y-auto p-4"><section class="relative my-auto w-full max-w-4xl overflow-hidden rounded-[28px] border border-white/15 bg-[#10131d] shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="gateway-title"><div class="grid md:grid-cols-[.92fr_1.08fr]"><div class="relative hidden min-h-[510px] overflow-hidden bg-[#151326] md:block"><img src="${img("photo-1519681393784-d120267933ba",1000)}" alt="" class="absolute inset-0 h-full w-full object-cover opacity-45"><div class="absolute inset-0 bg-gradient-to-t from-[#10131d] via-[#10131d]/25 to-violet-950/20"></div><div class="absolute bottom-8 left-8 right-8"><span class="flex h-11 w-11 items-center justify-center rounded-2xl bg-violet-400 text-white"><i class="fa-solid fa-play"></i></span><h2 class="display mt-5 text-3xl font-semibold">Un universo de historias, a tu manera.</h2><p class="mt-3 text-sm leading-6 text-slate-300">Descubre la colección o entra a tu espacio de trabajo privado.</p></div></div><div class="p-6 sm:p-9"><div class="flex items-center gap-2 text-sm font-bold"><span class="flex h-8 w-8 items-center justify-center rounded-lg bg-violet-400 text-white"><i class="fa-solid fa-play text-[10px]"></i></span>mediahub<span class="text-violet-300">.</span></div><div class="mt-7"><p class="text-[11px] font-bold uppercase tracking-[.2em] text-violet-300">Puerta de acceso</p><h1 id="gateway-title" class="display mt-2 text-3xl font-semibold">¿Cómo quieres entrar?</h1><p class="mt-2 text-sm leading-6 text-slate-400">Elige una experiencia para comenzar.</p></div>
          <div class="mt-6 rounded-2xl border border-emerald-300/15 bg-emerald-300/[.04] p-4"><div class="flex items-center gap-3"><span class="flex h-9 w-9 items-center justify-center rounded-xl bg-emerald-300/10 text-emerald-200"><i class="fa-solid fa-earth-americas"></i></span><div><h2 class="text-sm font-semibold">Modo Público</h2><p class="mt-1 text-xs text-slate-400">Explora todo el contenido disponible para visitantes.</p></div></div><button id="enter-public" class="mt-4 w-full rounded-xl bg-emerald-300 px-4 py-3 text-sm font-bold text-[#0c1914] transition hover:bg-emerald-200">Aceptar y entrar <i class="fa-solid fa-arrow-right ml-1"></i></button></div>
          <div class="my-5 flex items-center gap-3 text-[10px] uppercase tracking-widest text-slate-600"><span class="h-px flex-1 bg-white/10"></span>o entra con tu cuenta<span class="h-px flex-1 bg-white/10"></span></div>
          <form id="login-form" class="space-y-3"><div><label for="login-username" class="field-label">Nombre de usuario</label><input class="field" id="login-username" name="username" required autocomplete="username" placeholder="Tu usuario"></div><div><label for="login-pin" class="field-label">PIN privado de 6 dígitos</label><input class="field" id="login-pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="current-password" placeholder="••••••"></div><p class="text-[11px] leading-5 text-slate-500"><i class="fa-solid fa-lock mr-1"></i>El modo privado permite acceder al contenido y al estudio según tu rol.</p><button class="btn-primary w-full" type="submit">Entrar en modo privado <i class="fa-solid fa-arrow-right ml-1"></i></button></form>
          <p class="mt-4 text-center text-[10px] leading-5 text-slate-600">Acceso inicial del administrador: admin / 123456<br>Las cuentas se guardan en este navegador; la autenticación de producción requiere un servidor.</p>
        </div></div></section></div>`;
        $("#enter-public").addEventListener("click",()=>{state.session={mode:"public"};persist();$("#modal-root").innerHTML="";page="inicio";if(!location.hash)history.replaceState(null,"","#inicio");render()});
        $("#login-form").addEventListener("submit",e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));const found=state.users.find(u=>u.username.toLowerCase()===String(d.username).trim().toLowerCase()&&u.pin===d.pin);if(!found){toast("Usuario o PIN incorrectos.","error");return}state.session={userId:found.id};persist();$("#modal-root").innerHTML="";toast(`Bienvenido, ${found.username}.`);render()})
      }
      function applyMute(){
        $$("video,audio").forEach(media=>{media.muted=state.muted});
        $$("iframe").forEach(frame=>{try{frame.contentWindow.postMessage(JSON.stringify({event:"command",func:state.muted?"mute":"unMute",args:[]}),"*");frame.contentWindow.postMessage({method:"setMuted",value:state.muted},"*");frame.contentWindow.postMessage({method:"setVolume",value:state.muted?0:1},"*")}catch(error){console.debug("El reproductor integrado no permite controlar el audio.",error)}})
      }
      document.addEventListener("click",e=>{
        const nav=e.target.closest("[data-page]");if(nav){const next=routeAllowed(nav.dataset.page);if(next!==page||nav.dataset.page==="inicio")setHash(next)}
      });
      $("#orientation-toggle").addEventListener("click",()=>{state.orientationMode=state.orientationMode==="vertical"?"horizontal":"vertical";persist();render();toast(`Vista ${state.orientationMode==="vertical"?"vertical 9:16":"horizontal 16:9"}.`)});
      $("#sound-toggle").addEventListener("click",()=>{state.muted=!state.muted;persist();render();toast(state.muted?"Sonido silenciado en todos los reproductores.":"Sonido activado.")});
      $("#logout-button").addEventListener("click",()=>{state.session=null;persist();activeComic=null;accessModal()});
      window.addEventListener("hashchange",()=>{page=location.hash.slice(1)||"inicio";activeComic=null;render()});
      window.addEventListener("storage",e=>{if(e.key===STORAGE_KEY){state=loadState();render()}});
      if(state.session?.userId&&!user())state.session=null;
      render();if(!state.session)accessModal();
    })();
  </script>
</body>
</html>
